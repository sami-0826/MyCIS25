<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyCIS 25</title>
    <meta name="description" content="Minimal and clean class routine and schedule manager for CIS Batch-25." />
    <meta property="og:title" content="MyCIS 25" />
    <meta property="og:description" content="Minimal and clean class routine and schedule manager for CIS Batch-25." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((error) => {
            console.error('Service worker registration failed:', error);
          });
        });
      }
    </script>
    <script>
      let deferredPrompt;

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const installBtn = document.getElementById('installBtn');
        if (installBtn) {
          installBtn.style.display = 'inline-flex';
        }
      });

      const installBtn = document.getElementById('installBtn');
      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            const choiceResult = await deferredPrompt.userChoice;
            console.log('User choice:', choiceResult);
            deferredPrompt = null;
            installBtn.style.display = 'none';
          }
        });
      }

      // Ensure click handling functions seamlessly when the header is rendered dynamically
      document.addEventListener('click', async (e) => {
        const btn = e.target && e.target.closest ? e.target.closest('#installBtn') : null;
        if (btn && deferredPrompt) {
          deferredPrompt.prompt();
          const choiceResult = await deferredPrompt.userChoice;
          console.log('User choice:', choiceResult);
          deferredPrompt = null;
          btn.style.display = 'none';
        }
      });

      // Show button if beforeinstallprompt fired prior to the element mounting in the DOM
      const observer = new MutationObserver(() => {
        const btn = document.getElementById('installBtn');
        if (btn && deferredPrompt && btn.style.display === 'none') {
          btn.style.display = 'inline-flex';
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
